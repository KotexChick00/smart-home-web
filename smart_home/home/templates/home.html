<!DOCTYPE html>
<html>
<head>
    <title>Smart Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .card {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            width: 300px;
        }

        button {
            margin: 5px;
            padding: 8px 12px;
            cursor: pointer;
        }

        .status {
            margin-top: 10px;
            font-weight: bold;
        }

        .sensor {
            font-size: 18px;
        }
    </style>
</head>

<body>

<h1>Smart Home Control</h1>

<!-- LED -->
<div class="card">
    <h2>LED</h2>
    <button onclick="controlDevice(LED_URL, 'ON', 'led-status')">Turn ON</button>
    <button onclick="controlDevice(LED_URL, 'OFF', 'led-status')">Turn OFF</button>
    <div id="led-status" class="status">Status: -</div>
</div>

<!-- FAN -->
<div class="card">
    <h2>Fan</h2>
    <button onclick="controlDevice(FAN_URL, 'ON', 'fan-status')">Turn ON</button>
    <button onclick="controlDevice(FAN_URL, 'OFF', 'fan-status')">Turn OFF</button>
    <div id="fan-status" class="status">Status: -</div>
</div>

<!-- SENSORS -->
<div class="card">
    <h2>Sensor Data</h2>

    <div class="sensor">
        Light: <span id="light-data">-</span>
    </div>

    <div class="sensor">
        Temperature: <span id="temp-data">-</span>
    </div>
</div>

<script>
const LED_URL = "/control_led/";
const FAN_URL = "/control_fan/";
const LIGHT_URL = "/get_light_data/";
const TEMP_URL = "/get_temp_data/";

/* ---------------- Device Control ---------------- */

async function controlDevice(url, state, statusId) {
    try {
        const res = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ state })
        });

        const data = await res.json();
        document.getElementById(statusId).innerText =
            data.status || data.error || "Unknown response";

    } catch (err) {
        document.getElementById(statusId).innerText = "Request failed";
    }
}

/* ---------------- Sensor Polling ---------------- */

async function updateSensors() {
    try {
        const lightRes = await fetch(LIGHT_URL);
        const lightData = await lightRes.json();

        const tempRes = await fetch(TEMP_URL);
        const tempData = await tempRes.json();

        document.getElementById("light-data").innerText =
            lightData.value ?? "N/A";

        document.getElementById("temp-data").innerText =
            tempData.temp ?? "N/A";

    } catch (err) {
        console.error("Sensor update failed", err);
    }
}

/* ---------------- Auto Refresh ---------------- */

setInterval(updateSensors, 2000);
updateSensors();

</script>

</body>
</html>
