<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Home - Manage Users</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h1 { font-size: 24px; font-weight: 600; margin: 0; color: #38bdf8; }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-back { background: #334155; color: white; }
        .btn-back:hover { background: #475569; }

        .user-list {
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #334155;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #0f172a;
            padding: 16px 24px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
        }

        td {
            padding: 16px 24px;
            border-top: 1px solid #334155;
            font-size: 15px;
        }

        tr:hover td { background: #1e293b; }

        .btn-delete {
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-delete:hover { background: #dc2626; }

        .empty-state {
            padding: 60px;
            text-align: center;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Authorized Users</h1>
    <a href="/dashboard/" class="btn btn-back">Back to Dashboard</a>
</div>

<div class="user-list">
    <table>
        <thead>
            <tr>
                <th style="width: 80px;">#</th>
                <th>Full Name</th>
                <th style="width: 120px; text-align: right;">Action</th>
            </tr>
        </thead>
        <tbody id="user-table-body">
            {% for i, name in users %}
            <tr id="row-{{ i }}">
                <td>{{ i|add:1 }}</td>
                <td><strong>{{ name }}</strong></td>
                <td style="text-align: right;">
                    <button class="btn btn-delete" onclick="deleteUser({{ i }})">Remove</button>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="empty-state">No users registered yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
    async function deleteUser(index) {
        if (!confirm("Are you sure you want to remove this user's access?")) return;

        try {
            const response = await fetch('/delete_user/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ index: index })
            });
            const data = await response.json();
            if (data.status === 'success') {
                document.getElementById('row-' + index).remove();
            } else {
                alert("Error deleting user.");
            }
        } catch (error) {
            console.error("Delete failed", error);
        }
    }
</script>

</body>
</html>
